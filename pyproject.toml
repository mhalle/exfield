[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "exfield"
version = "0.5.3"
description = "Read, evaluate and write OpenCMISS-Zinc EX/EXF finite element scaffolds with NumPy as the only dependency"
readme = "README.md"
# floor is tested, not aspirational: the suite passes on 3.10/3.12/3.14
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "SPARC map-core" }]
keywords = ["finite-elements", "scaffold", "anatomy", "SPARC",
            "OpenCMISS", "Zinc", "EX", "EXF", "Bezier", "VTK"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
dependencies = ["numpy>=1.22"]

[project.optional-dependencies]
test = ["pytest>=7"]

[dependency-groups]
dev = ["pytest>=7", "ruff>=0.6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
